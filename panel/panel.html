<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DualSense Panel</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5b6170; --line: #d9dce3;
  --accent: #1f5fd6; --accent-text: #ffffff; --danger: #b42318; --field: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1a1d23; --text: #eceef2; --muted: #9aa1ae; --line: #2e333c;
    --accent: #6c9cff; --accent-text: #0b1220; --danger: #ff6b5e; --field: #14171c;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1a1d23; --text: #eceef2; --muted: #9aa1ae; --line: #2e333c;
  --accent: #6c9cff; --accent-text: #0b1220; --danger: #ff6b5e; --field: #14171c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
.status { color: var(--muted); font-size: 14px; }
.status b { color: var(--text); font-weight: 600; }
.prefs { display: flex; gap: 8px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.wide { grid-column: 1 / -1; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.row:last-child { margin-bottom: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-bottom: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }
button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--field); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .45; cursor: default; }
select, input[type=number] { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--field); color: var(--text); }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 120px; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 17px; height: 17px; }
input[type=color] { width: 48px; height: 34px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); }
label { display: inline-flex; gap: 6px; align-items: center; }
.slider { display: grid; grid-template-columns: 90px 1fr 48px; gap: 10px; align-items: center; margin-bottom: 8px; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: 14px; }
.msg { min-height: 20px; font-size: 14px; color: var(--muted); }
.msg.err { color: var(--danger); }
.live { display: grid; grid-template-columns: auto auto 1fr; gap: 16px; align-items: start; }
@media (max-width: 560px) { .live { grid-template-columns: 1fr 1fr; } .live .btns { grid-column: 1 / -1; } }
svg text { fill: var(--muted); font-size: 11px; }
.btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.btns div { border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 5px 2px; font-size: 13px; }
.btns div.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.bars { display: grid; grid-template-columns: 28px 1fr 44px; gap: 8px; align-items: center; margin-top: 12px; }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
table.motion { border-collapse: collapse; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
table.motion td, table.motion th { padding: 3px 14px 3px 0; text-align: right; }
table.motion th { color: var(--muted); font-weight: 500; text-align: left; }
.leds { display: flex; gap: 10px; }
.trig { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; margin-bottom: 14px; }
.trig .params { grid-column: 2; }
pre#log { margin: 0; max-height: 260px; overflow: auto; font: 12px/1.4 ui-monospace, Consolas, monospace;
  background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; }
.hidden { display: none !important; }
#connectBar { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>DualSense Panel</h1>
    <div class="status" id="topStatus">-</div>
  </div>
  <div class="prefs">
    <select id="lang" aria-label="Language">
      <option value="auto">Auto</option><option value="pl">Polski</option><option value="en">English</option>
    </select>
    <select id="theme" aria-label="Theme">
      <option value="auto" data-t="themeAuto">Auto</option>
      <option value="light" data-t="themeLight">Light</option>
      <option value="dark" data-t="themeDark">Dark</option>
    </select>
  </div>
</header>

<main>
  <section id="connectBar" class="hidden">
    <div class="row">
      <button class="primary" id="btnUsb" data-t="connectUsb">Connect over USB</button>
      <span class="muted" id="usbNote"></span>
    </div>
  </section>

  <section>
    <h2 data-t="secController">Controller</h2>
    <div class="kv">
      <span data-t="lblState">State</span><span id="btState">-</span>
      <span data-t="lblPaired">Paired</span><span id="btMac">-</span>
      <span data-t="lblBattery">Battery</span><span id="bat">-</span>
    </div>
    <div class="row">
      <button id="btnPair" data-t="pair">Search</button>
      <button id="btnDisc" data-t="disconnect">Disconnect</button>
      <button id="btnUnpair" class="danger" data-t="unpair">Unpair</button>
    </div>
    <div class="msg" id="msgCtrl"></div>
  </section>

  <section>
    <h2 data-t="secLight">Light</h2>
    <div class="row">
      <input type="color" id="lightColor" value="#0000ff">
      <button id="btnLight" data-t="apply">Apply</button>
      <button id="btnLightOff" data-t="off">Off</button>
    </div>
    <div class="row">
      <span class="muted" data-t="lblPlayer">Player LEDs</span>
      <div class="leds" id="leds"></div>
    </div>
    <div class="row">
      <select id="ledBright">
        <option value="0" data-t="bHigh">High</option>
        <option value="1" data-t="bMid">Medium</option>
        <option value="2" data-t="bLow">Low</option>
      </select>
      <button id="btnLeds" data-t="apply">Apply</button>
    </div>
  </section>

  <section class="wide">
    <h2 data-t="secLive">Live input</h2>
    <div class="live">
      <svg id="sticks" width="200" height="104" viewBox="0 0 200 104" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-opacity=".25"/>
        <circle cx="150" cy="50" r="44" fill="none" stroke="currentColor" stroke-opacity=".25"/>
        <line x1="50" y1="6" x2="50" y2="94" stroke="currentColor" stroke-opacity=".12"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="currentColor" stroke-opacity=".12"/>
        <line x1="150" y1="6" x2="150" y2="94" stroke="currentColor" stroke-opacity=".12"/>
        <line x1="106" y1="50" x2="194" y2="50" stroke="currentColor" stroke-opacity=".12"/>
        <circle id="ls" cx="50" cy="50" r="7" fill="var(--accent)"/>
        <circle id="rs" cx="150" cy="50" r="7" fill="var(--accent)"/>
      </svg>
      <svg id="touch" width="168" height="94" viewBox="0 0 168 94" aria-hidden="true">
        <rect x="1" y="1" width="166" height="92" rx="8" fill="none" stroke="currentColor" stroke-opacity=".25"/>
        <circle id="tp" cx="84" cy="47" r="7" fill="var(--accent)" class="hidden"/>
      </svg>
      <div class="btns" id="btns"></div>
    </div>
    <div class="bars">
      <span>L2</span><div class="bar"><i id="l2bar"></i></div><span class="num" id="l2val">0%</span>
      <span>R2</span><div class="bar"><i id="r2bar"></i></div><span class="num" id="r2val">0%</span>
    </div>
  </section>

  <section>
    <h2 data-t="secMotion">Motion</h2>
    <div class="row"><label><input type="checkbox" id="motion"> <span data-t="motionOn">Motion sensors</span></label></div>
    <table class="motion">
      <tr><th></th><th>X</th><th>Y</th><th>Z</th></tr>
      <tr><th data-t="gyro">Gyro °/s</th><td id="gx">-</td><td id="gy">-</td><td id="gz">-</td></tr>
      <tr><th data-t="accel">Accel g</th><td id="ax">-</td><td id="ay">-</td><td id="az">-</td></tr>
    </table>
    <div class="row">
      <button id="btnCalib" data-t="calib">Zero gyro</button>
      <button id="btnCalibReset" data-t="calibReset">Reset</button>
    </div>
    <div class="msg" id="calStatus"></div>
  </section>

  <section>
    <h2 data-t="secRumble">Rumble</h2>
    <div class="slider"><span data-t="left">Left</span><input type="range" id="rumL" min="0" max="255" value="128"><output id="rumLv"></output></div>
    <div class="slider"><span data-t="right">Right</span><input type="range" id="rumR" min="0" max="255" value="128"><output id="rumRv"></output></div>
    <div class="slider"><span data-t="duration">Duration</span><input type="range" id="rumMs" min="100" max="3000" step="100" value="600"><output id="rumMsv"></output></div>
    <div class="row"><button class="primary" id="btnRumble" data-t="test">Test</button></div>
  </section>

  <section>
    <h2 data-t="secTriggers">Adaptive triggers</h2>
    <div id="trigs"></div>
    <div class="row"><button id="btnTrigOff" data-t="trigOff">Turn both off</button></div>
  </section>

  <section>
    <h2>Wi-Fi</h2>
    <div class="kv">
      <span data-t="lblNetwork">Network</span><span id="ssid">-</span>
      <span data-t="lblNow">Now</span><span id="wifiNow">-</span>
    </div>
    <div class="row">
      <label><input type="radio" name="wifi" value="auto"> <span data-t="wifiAuto">Auto</span></label>
      <label><input type="radio" name="wifi" value="on"> <span data-t="wifiOn">Always on</span></label>
      <label><input type="radio" name="wifi" value="off"> <span data-t="wifiOff">Off</span></label>
    </div>
    <div class="muted" data-t="wifiNote">Auto: Wi-Fi only when no PC is connected over USB.</div>
  </section>

  <section class="wide hidden" id="logBox">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ---------- i18n ----------
const T = {
  en: {
    themeAuto: "Auto", themeLight: "Light", themeDark: "Dark",
    connectUsb: "Connect over USB", noSerial: "This browser has no Web Serial. Use Chrome or Edge.",
    secController: "Controller", lblState: "State", lblPaired: "Paired", lblBattery: "Battery",
    pair: "Search", disconnect: "Disconnect", unpair: "Unpair",
    secLight: "Light", apply: "Apply", off: "Off", lblPlayer: "Player LEDs",
    bHigh: "High", bMid: "Medium", bLow: "Low",
    secLive: "Live input", secMotion: "Motion", motionOn: "Motion sensors",
    gyro: "Gyro °/s", accel: "Accel g", calib: "Zero gyro", calibReset: "Reset",
    secRumble: "Rumble", left: "Left", right: "Right", duration: "Duration", test: "Test",
    secTriggers: "Adaptive triggers", trigOff: "Turn both off", start: "Start", force: "Force",
    lblNetwork: "Network", lblNow: "Now", wifiAuto: "Auto", wifiOn: "Always on", wifiOff: "Off",
    wifiNote: "Auto: Wi-Fi only when no PC is connected over USB.",
    st_connected: "connected", st_searching: "searching (hold PS + Create)", st_waiting: "waiting for the controller (press PS)",
    st_idle: "not searching", none: "none", on: "on", offW: "off",
    picoOffline: "No connection to Pico", viaUsb: "USB", viaWifi: "Wi-Fi",
    confirmUnpair: "Remove the paired controller from Pico?",
    confirmWifiOff: "You are connected over Wi-Fi. Turning it off will end this connection. Continue?",
    cal_none: "", cal_running: "Keep the controller still...", cal_done: "Gyro zeroed.",
    cal_moving: "The controller moved. Put it on a flat surface and try again.", cal_nopad: "No controller connected.",
    factory: "Factory calibration loaded.", noFactory: "Factory calibration not loaded.",
    err_nopad: "No controller connected.", err_busy: "Pico is busy, try again.", err_connected: "Already connected.",
    m_off: "Off", m_res: "Resistance", m_gamecube: "GameCube", m_feedback: "Feedback", m_bow: "Bow",
    m_gallop: "Gallop", m_weapon: "Weapon", m_autogun: "Automatic gun", m_machine: "Machine",
    b: ["Cross", "Circle", "Square", "Triangle", "L1", "R1", "L2", "R2", "Create", "Options", "L3", "R3", "PS", "Touch", "Mute", "Up", "Down", "Left", "Right"]
  },
  pl: {
    themeAuto: "Auto", themeLight: "Jasny", themeDark: "Ciemny",
    connectUsb: "Połącz przez USB", noSerial: "Ta przeglądarka nie ma Web Serial. Użyj Chrome albo Edge.",
    secController: "Kontroler", lblState: "Stan", lblPaired: "Sparowany", lblBattery: "Bateria",
    pair: "Szukaj", disconnect: "Rozłącz", unpair: "Rozparuj",
    secLight: "Światło", apply: "Ustaw", off: "Wyłącz", lblPlayer: "Diody gracza",
    bHigh: "Mocno", bMid: "Średnio", bLow: "Słabo",
    secLive: "Podgląd", secMotion: "Ruch", motionOn: "Czujniki ruchu",
    gyro: "Żyroskop °/s", accel: "Akcelerometr g", calib: "Zeruj żyroskop", calibReset: "Przywróć",
    secRumble: "Wibracje", left: "Lewa", right: "Prawa", duration: "Czas", test: "Testuj",
    secTriggers: "Triggery", trigOff: "Wyłącz oba", start: "Początek", force: "Siła",
    lblNetwork: "Sieć", lblNow: "Teraz", wifiAuto: "Auto", wifiOn: "Zawsze", wifiOff: "Wyłączone",
    wifiNote: "Auto: Wi-Fi tylko wtedy, gdy Pico nie jest podłączone do PC.",
    st_connected: "połączony", st_searching: "szuka (przytrzymaj PS + Create)", st_waiting: "czeka na pada (wciśnij PS)",
    st_idle: "nie szuka", none: "brak", on: "włączone", offW: "wyłączone",
    picoOffline: "Brak połączenia z Pico", viaUsb: "USB", viaWifi: "Wi-Fi",
    confirmUnpair: "Usunąć sparowanego pada z Pico?",
    confirmWifiOff: "Jesteś połączony przez Wi-Fi. Wyłączenie go zakończy to połączenie. Kontynuować?",
    cal_none: "", cal_running: "Nie ruszaj pada...", cal_done: "Żyroskop wyzerowany.",
    cal_moving: "Pad się ruszał. Połóż go na płaskiej powierzchni i spróbuj jeszcze raz.", cal_nopad: "Brak połączonego pada.",
    factory: "Kalibracja fabryczna wczytana.", noFactory: "Kalibracja fabryczna niewczytana.",
    err_nopad: "Brak połączonego pada.", err_busy: "Pico jest zajęte, spróbuj jeszcze raz.", err_connected: "Pad jest już połączony.",
    m_off: "Wyłączony", m_res: "Opór", m_gamecube: "GameCube", m_feedback: "Twardy opór", m_bow: "Łuk",
    m_gallop: "Galop", m_weapon: "Broń", m_autogun: "Karabin", m_machine: "Maszyna",
    b: ["Krzyżyk", "Kółko", "Kwadrat", "Trójkąt", "L1", "R1", "L2", "R2", "Create", "Options", "L3", "R3", "PS", "Touchpad", "Mute", "Góra", "Dół", "Lewo", "Prawo"]
  }
};
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = "en";
function t(k) { return (T[lang] && T[lang][k] !== undefined) ? T[lang][k] : (T.en[k] ?? k); }
function applyLang() {
  const pref = store.get("lang", "auto");
  $("lang").value = pref;
  lang = pref === "auto" ? ((navigator.language || "en").toLowerCase().startsWith("pl") ? "pl" : "en") : pref;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  buildButtons(); buildTriggers(); render();
}
function applyTheme() {
  const v = store.get("theme", "auto");
  $("theme").value = v;
  if (v === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
}
$("lang").onchange = e => { store.set("lang", e.target.value); applyLang(); };
$("theme").onchange = e => { store.set("theme", e.target.value); applyTheme(); };

// ---------- transport ----------
const viaHttp = location.protocol === "http:" || location.protocol === "https:";
let state = null, online = false;
let port = null, writer = null;

async function send(cmd) {
  if (viaHttp) {
    try {
      const r = await fetch("/api/cmd?q=" + encodeURIComponent(cmd), { cache: "no-store" });
      const j = await r.json();
      if (!j.ok) showErr(j.err);
    } catch (e) { showErr("offline"); }
  } else {
    if (!writer) return;
    try { await writer.write(new TextEncoder().encode(cmd + "\n")); } catch (e) { serialLost(); }
  }
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    state = await r.json(); online = true;
  } catch (e) { online = false; }
  render();
  setTimeout(poll, online ? 120 : 1000);
}

const logLines = [];
function addLog(line) {
  logLines.push(line);
  if (logLines.length > 300) logLines.shift();
  const el = $("log");
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
  el.textContent = logLines.join("\n");
  if (atBottom) el.scrollTop = el.scrollHeight;
}

async function serialOpen(p) {
  port = p;
  await port.open({ baudRate: 115200 });
  try { await port.setSignals({ dataTerminalReady: true }); } catch (e) {}
  writer = port.writable.getWriter();
  online = true;
  $("connectBar").classList.add("hidden");
  $("logBox").classList.remove("hidden");
  render();
  readLoop();
  setTimeout(() => send("stream 1"), 150);
}

async function readLoop() {
  const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).replace(/\r$/, "");
        buf = buf.slice(i + 1);
        if (line.startsWith("@S ")) { try { state = JSON.parse(line.slice(3)); render(); } catch (e) {} }
        else if (line.startsWith("@R ")) { try { const j = JSON.parse(line.slice(3)); if (!j.ok) showErr(j.err); } catch (e) {} }
        else if (line.length) addLog(line);
      }
    }
  } catch (e) {}
  serialLost();
}

function serialLost() {
  online = false; writer = null; state = null;
  try { port && port.close(); } catch (e) {}
  port = null;
  $("connectBar").classList.remove("hidden");
  render();
}

$("btnUsb").onclick = async () => {
  try {
    const p = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2E8A }] });
    await serialOpen(p);
  } catch (e) { $("usbNote").textContent = e.message || String(e); }
};

// ---------- UI pieces ----------
const BTN_COUNT = 19;
function buildButtons() {
  const box = $("btns");
  box.innerHTML = "";
  for (let i = 0; i < BTN_COUNT; i++) {
    const d = document.createElement("div");
    d.textContent = t("b")[i];
    box.appendChild(d);
  }
}

const MODES = ["off", "res", "gamecube", "feedback", "bow", "gallop", "weapon", "autogun", "machine"];
function buildTriggers() {
  const box = $("trigs");
  const prev = {};
  ["l", "r"].forEach(h => { const s = $("tm_" + h); if (s) prev[h] = { m: s.value, a: $("ta_" + h).value, b: $("tb_" + h).value }; });
  box.innerHTML = "";
  [["l", "L2"], ["r", "R2"]].forEach(([h, name]) => {
    const wrap = document.createElement("div");
    wrap.className = "trig";
    wrap.innerHTML =
      `<strong>${name}</strong>
       <div class="row" style="margin:0"><select id="tm_${h}">${MODES.map(m => `<option value="${m}">${t("m_" + m)}</option>`).join("")}</select>
       <button id="tapply_${h}">${t("apply")}</button></div>
       <div class="params" id="tp_${h}">
         <div class="slider"><span>${t("start")}</span><input type="range" id="ta_${h}" min="0" max="255" value="60"><output id="tav_${h}"></output></div>
         <div class="slider"><span>${t("force")}</span><input type="range" id="tb_${h}" min="0" max="255" value="160"><output id="tbv_${h}"></output></div>
       </div>`;
    box.appendChild(wrap);
    const sel = $("tm_" + h);
    if (prev[h]) { sel.value = prev[h].m; $("ta_" + h).value = prev[h].a; $("tb_" + h).value = prev[h].b; }
    const sync = () => {
      $("tp_" + h).classList.toggle("hidden", sel.value !== "res");
      $("tav_" + h).textContent = Math.round($("ta_" + h).value / 2.55) + "%";
      $("tbv_" + h).textContent = Math.round($("tb_" + h).value / 2.55) + "%";
    };
    sel.onchange = sync; $("ta_" + h).oninput = sync; $("tb_" + h).oninput = sync; sync();
    $("tapply_" + h).onclick = () => {
      const m = sel.value;
      send(m === "res" ? `trig ${h} res ${$("ta_" + h).value} ${$("tb_" + h).value}` : `trig ${h} ${m}`);
    };
  });
}
$("btnTrigOff").onclick = () => { send("trig b off"); ["l", "r"].forEach(h => { $("tm_" + h).value = "off"; $("tm_" + h).onchange(); }); };

// Player LEDs: 5 checkboxes, bit 0 = leftmost
(function () {
  const box = $("leds");
  for (let i = 0; i < 5; i++) {
    const c = document.createElement("input");
    c.type = "checkbox"; c.id = "led" + i; c.setAttribute("aria-label", "LED " + (i + 1));
    box.appendChild(c);
  }
})();
$("btnLeds").onclick = () => {
  let m = 0;
  for (let i = 0; i < 5; i++) if ($("led" + i).checked) m |= 1 << i;
  send(`player ${m} ${$("ledBright").value}`);
};

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r, g, b) { return "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join(""); }
$("btnLight").onclick = () => send("light " + hexToRgb($("lightColor").value).join(" "));
$("btnLightOff").onclick = () => send("light 0 0 0");

function syncRumble() {
  $("rumLv").textContent = Math.round($("rumL").value / 2.55) + "%";
  $("rumRv").textContent = Math.round($("rumR").value / 2.55) + "%";
  $("rumMsv").textContent = ($("rumMs").value / 1000).toFixed(1) + " s";
}
["rumL", "rumR", "rumMs"].forEach(id => $(id).oninput = syncRumble);
syncRumble();
$("btnRumble").onclick = () => send(`rumble ${$("rumL").value} ${$("rumR").value} ${$("rumMs").value}`);

$("motion").onchange = e => send("motion " + (e.target.checked ? 1 : 0));
$("btnCalib").onclick = () => send("calib");
$("btnCalibReset").onclick = () => send("calib reset");
$("btnPair").onclick = () => send("pair");
$("btnDisc").onclick = () => send("disconnect");
$("btnUnpair").onclick = () => { if (confirm(t("confirmUnpair"))) send("unpair"); };
document.querySelectorAll("input[name=wifi]").forEach(r => r.onchange = e => {
  const v = e.target.value;
  if (viaHttp && v === "off" && !confirm(t("confirmWifiOff"))) { render(true); return; }
  send("wifi " + v);
});

let msgTimer = 0;
function showErr(code) {
  const el = $("msgCtrl");
  el.textContent = t("err_" + code) !== "err_" + code ? t("err_" + code) : (code === "offline" ? t("picoOffline") : code);
  el.classList.add("err");
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.textContent = ""; el.classList.remove("err"); }, 4000);
}

// ---------- render ----------
let firstState = true;
function fmt(v, d) { return (v >= 0 ? " " : "") + v.toFixed(d); }
function render(forceWifi) {
  const s = state;
  const via = viaHttp ? t("viaWifi") : t("viaUsb");
  if (!online || !s) {
    $("topStatus").textContent = t("picoOffline");
  } else {
    const st = t("st_" + s.bt);
    const bat = s.bt === "connected" && s.bat >= 0 ? ` · ${t("lblBattery").toLowerCase()} ${s.bat}%` : "";
    $("topStatus").innerHTML = `Pico: <b>${via}</b> · ${t("secController").toLowerCase()}: <b>${st}</b>${bat}`;
  }
  const conn = !!(s && s.bt === "connected");
  document.querySelectorAll("main button").forEach(b => { if (b.id !== "btnUsb") b.disabled = !online; });
  if (!s) return;

  $("btState").textContent = t("st_" + s.bt);
  $("btMac").textContent = s.mac || t("none");
  $("bat").textContent = conn && s.bat >= 0 ? s.bat + "%" : "-";
  $("btnPair").disabled = !online || conn || s.bt === "searching";
  $("btnDisc").disabled = !online || !conn;

  // live input
  const R = 37;
  $("ls").setAttribute("cx", 50 + s.ls[0] * R); $("ls").setAttribute("cy", 50 - s.ls[1] * R);
  $("rs").setAttribute("cx", 150 + s.rs[0] * R); $("rs").setAttribute("cy", 50 - s.rs[1] * R);
  const tp = $("tp");
  if (s.tp[0] > 0) {
    tp.classList.remove("hidden");
    tp.setAttribute("cx", 8 + Math.min(1, s.tp[1] / 1920) * 152);
    tp.setAttribute("cy", 8 + Math.min(1, s.tp[2] / 1080) * 78);
  } else tp.classList.add("hidden");
  const cells = $("btns").children;
  for (let i = 0; i < cells.length; i++) cells[i].classList.toggle("on", !!(s.b & (1 << i)));
  [["l2", s.l2], ["r2", s.r2]].forEach(([k, v]) => {
    const p = Math.round(Math.max(0, Math.min(1, v)) * 100);
    $(k + "bar").style.width = p + "%"; $(k + "val").textContent = p + "%";
  });

  // motion
  $("motion").checked = !!s.mo;
  const showMo = conn && s.mo;
  ["gx", "gy", "gz"].forEach((id, i) => $(id).textContent = showMo ? fmt(s.gy[i], 1) : "-");
  ["ax", "ay", "az"].forEach((id, i) => $(id).textContent = showMo ? fmt(s.ac[i], 2) : "-");
  const calMsg = t("cal_" + s.cal.st);
  $("calStatus").textContent = calMsg || (conn ? (s.cal.f ? t("factory") : t("noFactory")) : "");

  // wifi
  $("ssid").textContent = s.wifi.ssid;
  $("wifiNow").textContent = s.wifi.on ? t("on") + " · 192.168.4.1" : t("offW");
  document.querySelectorAll("input[name=wifi]").forEach(r => r.checked = r.value === s.wifi.mode);

  if (firstState) {
    firstState = false;
    $("lightColor").value = rgbToHex(s.light[0], s.light[1], s.light[2]);
    for (let i = 0; i < 5; i++) $("led" + i).checked = !!(s.pl[0] & (1 << i));
    $("ledBright").value = String(s.pl[1]);
    ["l", "r"].forEach((h, i) => { if (MODES.includes(s.tr[i])) { $("tm_" + h).value = s.tr[i]; $("tm_" + h).onchange(); } });
  }
}

// ---------- start ----------
applyTheme();
applyLang();
if (viaHttp) {
  poll();
} else {
  $("connectBar").classList.remove("hidden");
  if (!("serial" in navigator)) {
    $("btnUsb").disabled = true;
    $("usbNote").textContent = t("noSerial");
  } else {
    navigator.serial.getPorts().then(ps => { const p = ps.find(x => (x.getInfo().usbVendorId === 0x2E8A)); if (p) serialOpen(p).catch(() => {}); });
    navigator.serial.addEventListener("connect", e => { if (!port && e.target.getInfo().usbVendorId === 0x2E8A) serialOpen(e.target).catch(() => {}); });
  }
}
</script>
</body>
</html>
